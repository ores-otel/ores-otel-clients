name: APM Tier-1 conformance

on:
  pull_request:
    paths:
      - 'contracts/ores-apm.lock.json'
      - 'clients/support-matrix.toml'
      - 'clients/rust/**'
      - 'clients/typescript/**'
      - 'clients/dart/**'
      - '.github/workflows/apm-tier1-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/ores-apm.lock.json'
      - 'clients/support-matrix.toml'
      - 'clients/rust/**'
      - 'clients/typescript/**'
      - 'clients/dart/**'
      - '.github/workflows/apm-tier1-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apm-tier1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact client candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Read pinned APM authority
        id: apm
        shell: bash
        run: |
          set -euo pipefail
          lock=contracts/ores-apm.lock.json
          revision="$(jq -er '.revision' "$lock")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          test "$(jq -er '.repository' "$lock")" = 'ores-otel/ores-interfaces'
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Check out exact APM authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ores-otel/ores-interfaces
          ref: ${{ steps.apm.outputs.revision }}
          path: .deps/ores-interfaces
          persist-credentials: false
          show-progress: false

      - name: Verify locked authority paths
        shell: bash
        run: |
          set -euo pipefail
          lock=contracts/ores-apm.lock.json
          for field in typespec jsonSchema fixture; do
            path=".deps/ores-interfaces/$(jq -er --arg field "$field" '.[$field]' "$lock")"
            test -s "$path"
          done

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Verify Rust model and canonical fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture=".deps/ores-interfaces/$(jq -er '.fixture' contracts/ores-apm.lock.json)"
          cargo fmt --manifest-path clients/rust/Cargo.toml -- --check
          cargo clippy --manifest-path clients/rust/Cargo.toml --all-targets -- -D warnings
          cargo run --quiet --manifest-path clients/rust/Cargo.toml --example verify_apm_fixture -- "$fixture"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Verify TypeScript model and canonical fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture=".deps/ores-interfaces/$(jq -er '.fixture' contracts/ores-apm.lock.json)"
          npx --yes --package=typescript@5.9.2 tsc \
            --noEmit --strict --target ES2022 --module ESNext --moduleResolution Bundler \
            --lib ES2022,DOM clients/typescript/src/*.ts
          npx --yes tsx@4.20.5 clients/typescript/apm-fixture.test.ts "$fixture"

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: '3.12.1'

      - name: Verify Dart model and canonical fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(pwd)/.deps/ores-interfaces/$(jq -er '.fixture' contracts/ores-apm.lock.json)"
          cd clients/dart
          dart pub get
          dart format --output=none --set-exit-if-changed lib test
          dart analyze
          ORES_APM_FIXTURE="$fixture" dart test test/apm_fixture_test.dart

      - name: Enforce support matrix honesty
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          doc = tomllib.loads(Path('clients/support-matrix.toml').read_text())
          langs = doc['languages']
          assert len(langs) >= 15, len(langs)
          tier1 = {k for k,v in langs.items() if v['tier'] == 1}
          assert tier1 == {'rust','dart','typescript'}, tier1
          assert all(langs[k]['apm'] == 'conformant' for k in tier1)
          assert all(v['apm'] in {'conformant','model-only','pending'} for v in langs.values())
          assert doc['apm']['contract_revision'] == '${{ steps.apm.outputs.revision }}'
          PY
